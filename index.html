ثواني أجهزلك الكود في مربع النسخ المباشر عشان تقدر تنسخه على طول. تفضل الكود في مربع جاهز للنسخ:
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة احترافية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --whatsapp-color: #25d366;
            --call-color: #007bff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            text-align: center;
        }
        .container {
            padding: 50px 20px;
        }
        h1 {
            font-size: 3rem;
            color: #333;
            margin-bottom: 20px;
        }
        .description {
            font-size: 2rem;
            color: #666;
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.6;
        }
        /* زر الواتساب */
        .whatsapp-btn {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background-color: var(--whatsapp-color);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-decoration: none;
            transition: transform 0.3s ease;
            z-index: 1000;
        }
        .whatsapp-btn:hover {
            transform: scale(1.1);
        }
        /* زر الاتصال */
        .call-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: var(--call-color);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-decoration: none;
            z-index: 1000;
            animation: vibrate 2s infinite ease-in-out;
        }
        @keyframes vibrate {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>أهلاً بك في موقعنا المميز</h1>
        <p class="description">
            نقدم لك أفضل الخدمات والحلول المتكاملة التي تلبي احتياجاتك بكل احترافية وجودة عالية. 
            فريق عملنا جاهز دائماً لدعمك وضمان نجاح مشروعك.
        </p>
    </div>

    <!-- أزرار التواصل -->
    <a href="https://wa.me/your_number" class="whatsapp-btn" target="_blank" aria-label="واتساب">
        <i class="fab fa-whatsapp"></i>
    </a>
    
    <a href="tel:your_number" class="call-btn" aria-label="اتصل بنا">
        <i class="fas fa-phone-alt"></i>
    </a>
</body>
</html>
